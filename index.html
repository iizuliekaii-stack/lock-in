<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Video</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      min-height: 100dvh;
    }

    #container {
      width: 100vw;
      height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #000;

      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    #player {
      /*
        Largest 9:16 rectangle that can fit
        completely inside the viewport.
      */
      width: min(
        100vw,
        calc(100dvh * 9 / 16)
      );

      height: min(
        100dvh,
        calc(100vw * 16 / 9)
      );

      border: 0;
      display: block;
    }

  #startOverlay {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10;
  }
  #startOverlay .btn {
    color: #fff;
    font-family: sans-serif;
    font-size: 18px;
    border: 2px solid #fff;
    padding: 14px 28px;
    border-radius: 30px;
  }
</style>
</head>
<body>
  <div id="startOverlay">
    <div class="btn">▶ Tap to start</div>
  </div>
  <div id="container">
    <iframe
      id="player"
      src="https://www.youtube.com/embed/8SkhiNmk614?playsinline=1&rel=0&modestbranding=1&loop=1&playlist=8SkhiNmk614&autoplay=0"
      title="YouTube video player"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    const overlay = document.getElementById('startOverlay');
    const container = document.getElementById('container');
    const iframe = document.getElementById('player');

    overlay.addEventListener('click', () => {
      // Request fullscreen on the container (must happen inside a user gesture)
      const el = container;
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.msRequestFullscreen) el.msRequestFullscreen();

      // Swap the src to enable autoplay now that we have a user gesture
      iframe.src = "https://www.youtube.com/embed/8SkhiNmk614?playsinline=1&rel=0&modestbranding=1&loop=1&playlist=8SkhiNmk614&autoplay=1";

      overlay.style.display = 'none';
    });
  </script>
</body>
</html>
