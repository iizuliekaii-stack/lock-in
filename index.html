<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  iframe {
    width: 100%;
    max-width: 405px;
    aspect-ratio: 9 / 16;
    height: 90vh;
    border: none;
  }
</style>
</head>
<body>
  <iframe
    src="https://www.youtube.com/embed/8SkhiNmk614?playsinline=1&rel=0&modestbranding=1"
    title="YouTube video player"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen>
  </iframe>
</body>
</html>
